[project]
name = "yidoca-ui"
version = "0.1.0"
description = "Sistema de diseño compartido de Yidoca para demos en Streamlit"
requires-python = ">=3.12"
dependencies = ["streamlit>=1.30", "altair>=5.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["yidoca_ui*"]
